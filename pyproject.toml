[project]
name = "dicominfra"
version = "0.0.0"
description = "醫療影像雲端服務 PoC 後端（FastAPI / PostgreSQL / RabbitMQ）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "pip-audit>=2.7",
    # 整合測試與契約測試用；M1、M3 會視需要移到正式依賴
    "asyncpg>=0.29",
    "asyncpg-stubs>=0.29",
    "aio-pika>=9.4",
    "jsonschema[format]>=4.23",
    "types-jsonschema",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dicominfra"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "RUF"]
# 專案文件與註解一律使用中文，全形標點會被誤判為易混淆字元
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: 需要真實的 Postgres／RabbitMQ（見 docs/adr/0003）",
]
