# 本機開發用基礎設施：真實的 Postgres 與 RabbitMQ（整合測試與開發共用）。
# 只使用 Compose Spec 的基本功能，相容 Docker Compose v2.10。
# 帳密為「僅限本機」的範例值，連接埠只綁定 127.0.0.1。
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dicominfra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dicominfra}
      POSTGRES_DB: ${POSTGRES_DB:-dicominfra}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20

volumes:
  pgdata:
  rabbitmqdata:
