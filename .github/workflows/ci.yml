name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.32"

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "uv==${UV_VERSION}"
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pip-audit

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dicominfra
          POSTGRES_PASSWORD: dicominfra
          POSTGRES_DB: dicominfra
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dicominfra -d dicominfra"
          --health-interval 5s --health-timeout 3s --health-retries 20
      rabbitmq:
        image: rabbitmq:4-management
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s --health-timeout 10s --health-retries 20
    env:
      # CI 專用的拋棄式服務，沒有任何機密
      TEST_DATABASE_URL: postgresql://dicominfra:dicominfra@127.0.0.1:5432/dicominfra
      TEST_AMQP_URL: amqp://guest:guest@127.0.0.1:5672/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "uv==${UV_VERSION}"
      - run: uv sync --frozen
      - run: uv run pytest

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t dicominfra:ci .
